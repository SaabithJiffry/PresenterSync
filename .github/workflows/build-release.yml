name: Build & Release PresenterSync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXEs (Host + Remote)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate or install AutoHotkey v2 & Ahk2Exe Compiler
        shell: pwsh
        run: |
          $ahkExe = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          if (-not (Test-Path $ahkExe)) {
            winget install --id AutoHotkey.AutoHotkey --exact --silent --scope machine --accept-package-agreements --accept-source-agreements
            if (-not (Test-Path $ahkExe)) {
              $localAhk = Join-Path $env:LOCALAPPDATA "Programs\AutoHotkey"
              if (Test-Path (Join-Path $localAhk "v2\AutoHotkey64.exe")) {
                New-Item -ItemType Directory -Path "C:\Program Files\AutoHotkey" -Force | Out-Null
                Copy-Item -Path "$localAhk\*" -Destination "C:\Program Files\AutoHotkey\" -Recurse -Force
              }
            }
          }
          if (-not (Test-Path $ahkExe)) {
            Write-Error "AutoHotkey64.exe not found at $ahkExe"
            exit 1
          }

          $compilerDir = "C:\Program Files\AutoHotkey\Compiler"
          $ahk2exe = Join-Path $compilerDir "Ahk2Exe.exe"
          if (-not (Test-Path $ahk2exe)) {
            New-Item -ItemType Directory -Path $compilerDir -Force | Out-Null
            $zipUrl = "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip"
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest" -Headers @{"User-Agent"="PresenterSync-CI"}
              $asset = $rel.assets | Where-Object { $_.name -like "Ahk2Exe*.zip" } | Select-Object -First 1
              if ($asset -and $asset.browser_download_url) { $zipUrl = $asset.browser_download_url }
            } catch {
              Write-Host "Falling back to pinned Ahk2Exe URL: $zipUrl"
            }
            $zipPath = Join-Path $env:TEMP "Ahk2Exe.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $compilerDir -Force
            Remove-Item -Force -ErrorAction SilentlyContinue $zipPath
          }
          if (-not (Test-Path $ahk2exe)) {
            Write-Error "Ahk2Exe.exe not found at $ahk2exe"
            exit 1
          }
          Write-Host "Found AutoHotkey64: $ahkExe"
          Write-Host "Found Ahk2Exe: $ahk2exe"

      - name: Run Windows Regression & Bridge Tests
        shell: pwsh
        run: |
          $ahk = "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe"
          foreach ($suite in @("tests\test_qr_code.ahk", "tests\test_host_bridge.ahk", "tests\test_multi_remote.ahk", "tests\test_v761_preresume_hotkey_audit.ahk", "tests\test_v762_aes_gcm_relay.ahk", "tests\test_v771_host_refactor_audit.ahk", "tests\test_v772_remote_refactor_audit.ahk", "tests\test_master_suite.ahk")) {
            Write-Host "Running $suite ..."
            $errLog = Join-Path $env:TEMP "ahk_stderr.txt"
            $outLog = Join-Path $env:TEMP "ahk_stdout.txt"
            Remove-Item -Force -ErrorAction SilentlyContinue $errLog, $outLog
            $p = Start-Process -FilePath $ahk -ArgumentList "/ErrorStdOut", $suite -Wait -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            if (Test-Path $outLog) { Get-Content $outLog }
            if (Test-Path $errLog) { Get-Content $errLog }
            if ($p.ExitCode -ne 0) {
              $failDetails = @()
              Get-ChildItem "tests\*_results.log" -ErrorAction SilentlyContinue | ForEach-Object {
                $failHits = Select-String -Path $_.FullName -Pattern "\[FAIL\]" | ForEach-Object { $_.Line }
                if ($failHits) { $failDetails += $failHits }
                Write-Host "=== $($_.Name) ==="
                Get-Content $_.FullName
              }
              if (-not $failDetails -and (Test-Path $errLog)) {
                $failDetails = (Get-Content $errLog -Raw) -replace "`r?`n", " | "
              }
              $summary = ($failDetails -join " ; ").Trim()
              if (-not $summary) { $summary = "ExitCode=$($p.ExitCode)" }
              Write-Host "::error title=$suite failed::$summary"
              exit $p.ExitCode
            }
          }
          Remove-Item -Force -ErrorAction SilentlyContinue "tests\*_results.log"

      - name: Build PresenterSync.exe & PresenterSync_Remote.exe
        run: cmd /c build.bat --nopause

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/PresenterSync.exe
            dist/PresenterSync_Remote.exe

  build-android:
    name: Build & Test Android Smart Board Client (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore (required on tag releases)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD, KEY_ALIAS, or KEY_PASSWORD secret is empty."
              exit 1
            fi
            JKS_PATH="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \t\r\n' | base64 -d > "$JKS_PATH"
            if [ ! -s "$JKS_PATH" ]; then
              echo "::error::Decoded release keystore file is empty."
              exit 1
            fi
            keytool -list -keystore "$JKS_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$JKS_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$GITHUB_WORKSPACE/android/keystore.properties"
            echo "KEYSTORE_FILE=$JKS_PATH" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::Release tag builds require ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets (refusing to publish a debug-signed APK)."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not configured; non-tag CI run will sign with debug keystore."
          fi

      - name: Run Android JVM Unit Tests & Assemble Release APK
        working-directory: android
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          chmod +x gradlew
          SIGN_FLAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* || "$HAS_KS" == "true" ]]; then
            SIGN_FLAG="-PrequireReleaseSigning=true"
          fi
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon $SIGN_FLAG

      - name: Stage dist/PresenterSync_Remote.apk
        run: |
          mkdir -p dist
          APK_RELEASE="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_RELEASE" ]; then
            cp "$APK_RELEASE" dist/PresenterSync_Remote.apk
          else
            echo "ERROR: APK output missing"
            exit 1
          fi

      - name: Verify APK Signature (apksigner)
        env:
          HAS_KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          VERIFY_OUT=$("$APKSIGNER" verify --verbose --print-certs dist/PresenterSync_Remote.apk)
          echo "$VERIFY_OUT"
          if [[ "${{ github.ref }}" == refs/tags/v* || "$HAS_KS" == "true" ]]; then
            if echo "$VERIFY_OUT" | grep -qi "Android Debug"; then
              echo "::error::APK is signed with Android Debug certificate instead of release keystore!"
              exit 1
            fi
            echo "$VERIFY_OUT" | grep -q "APK Signature Scheme v2): true" || { echo "::error::v2 signing missing"; exit 1; }
            echo "$VERIFY_OUT" | grep -q "APK Signature Scheme v3): true" || { echo "::error::v3 signing missing"; exit 1; }
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/PresenterSync_Remote.apk

  publish-release:
    name: Publish GitHub Release (3 Binaries)
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Stage flat release binaries & SHA256SUMS.txt
        run: |
          mkdir -p release-upload
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" \) -exec cp {} release-upload/ \;
          (cd release-upload && sha256sum PresenterSync.exe PresenterSync_Remote.exe PresenterSync_Remote.apk > SHA256SUMS.txt)
          cat release-upload/SHA256SUMS.txt
          ls -la release-upload

      - name: Create GitHub Release with all 3 binaries & checksums
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-upload/PresenterSync.exe
            release-upload/PresenterSync_Remote.exe
            release-upload/PresenterSync_Remote.apk
            release-upload/SHA256SUMS.txt
